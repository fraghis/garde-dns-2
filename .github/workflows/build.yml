name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompresser le projet
        run: unzip -q projet.zip -d projet
      - name: Cle de signature stable
        run: |
          mkdir -p ~/.android
          base64 -d projet/debug.keystore.b64 > ~/.android/debug.keystore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Construire l'APK
        working-directory: projet
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GardeDNS-apk
          path: projet/app/build/outputs/apk/debug/app-debug.apk
